<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" fill="none">
  <!-- Stylized Olive Tree based on GBO label design -->

  <!-- Mountain silhouette in background -->
  <path d="M0 180 Q100 140 200 160 Q300 140 400 180 L400 185 Q300 145 200 165 Q100 145 0 185 Z" fill="#c9a961" opacity="0.3"/>

  <!-- Tree trunk and roots -->
  <g fill="#1a1a1a">
    <!-- Main trunk -->
    <path d="M180 500 Q175 450 185 400 Q180 350 200 300 Q195 280 200 260" stroke="#1a1a1a" stroke-width="20" fill="none" stroke-linecap="round"/>
    <path d="M220 500 Q225 450 215 400 Q220 350 200 300" stroke="#1a1a1a" stroke-width="18" fill="none" stroke-linecap="round"/>

    <!-- Roots -->
    <path d="M180 500 Q140 480 100 490" stroke="#c9a961" stroke-width="8" fill="none" stroke-linecap="round"/>
    <path d="M175 495 Q150 470 120 475" stroke="#c9a961" stroke-width="6" fill="none" stroke-linecap="round"/>
    <path d="M220 500 Q260 480 300 490" stroke="#c9a961" stroke-width="8" fill="none" stroke-linecap="round"/>
    <path d="M225 495 Q250 470 280 475" stroke="#c9a961" stroke-width="6" fill="none" stroke-linecap="round"/>
  </g>

  <!-- Branches -->
  <g stroke="#1a1a1a" stroke-width="6" fill="none" stroke-linecap="round">
    <!-- Left branches -->
    <path d="M195 280 Q150 260 100 270"/>
    <path d="M190 250 Q140 220 90 230"/>
    <path d="M185 220 Q150 180 120 170"/>
    <path d="M190 200 Q160 150 140 130"/>

    <!-- Right branches -->
    <path d="M205 280 Q250 260 300 270"/>
    <path d="M210 250 Q260 220 310 230"/>
    <path d="M215 220 Q250 180 280 170"/>
    <path d="M210 200 Q240 150 260 130"/>

    <!-- Top branches -->
    <path d="M200 200 Q200 150 190 100"/>
    <path d="M200 200 Q210 140 220 90"/>
  </g>

  <!-- Leaves cluster - dark -->
  <g fill="#2a2a2a">
    <!-- Left side leaves -->
    <ellipse cx="90" cy="265" rx="25" ry="12" transform="rotate(-20 90 265)"/>
    <ellipse cx="75" cy="235" rx="22" ry="10" transform="rotate(-30 75 235)"/>
    <ellipse cx="100" cy="220" rx="20" ry="9" transform="rotate(-15 100 220)"/>
    <ellipse cx="110" cy="175" rx="22" ry="10" transform="rotate(-40 110 175)"/>
    <ellipse cx="130" cy="145" rx="20" ry="9" transform="rotate(-50 130 145)"/>
    <ellipse cx="140" cy="120" rx="18" ry="8" transform="rotate(-45 140 120)"/>

    <!-- Right side leaves -->
    <ellipse cx="310" cy="265" rx="25" ry="12" transform="rotate(20 310 265)"/>
    <ellipse cx="325" cy="235" rx="22" ry="10" transform="rotate(30 325 235)"/>
    <ellipse cx="300" cy="220" rx="20" ry="9" transform="rotate(15 300 220)"/>
    <ellipse cx="290" cy="175" rx="22" ry="10" transform="rotate(40 290 175)"/>
    <ellipse cx="270" cy="145" rx="20" ry="9" transform="rotate(50 270 145)"/>
    <ellipse cx="260" cy="120" rx="18" ry="8" transform="rotate(45 260 120)"/>

    <!-- Top leaves -->
    <ellipse cx="185" cy="95" rx="20" ry="9" transform="rotate(-10 185 95)"/>
    <ellipse cx="215" cy="85" rx="20" ry="9" transform="rotate(10 215 85)"/>
    <ellipse cx="200" cy="70" rx="18" ry="8"/>

    <!-- More scattered leaves -->
    <ellipse cx="150" cy="200" rx="18" ry="8" transform="rotate(-25 150 200)"/>
    <ellipse cx="250" cy="200" rx="18" ry="8" transform="rotate(25 250 200)"/>
    <ellipse cx="170" cy="160" rx="16" ry="7" transform="rotate(-35 170 160)"/>
    <ellipse cx="230" cy="160" rx="16" ry="7" transform="rotate(35 230 160)"/>
  </g>

  <!-- Golden olives -->
  <g fill="#c9a961">
    <ellipse cx="120" cy="250" rx="8" ry="11" transform="rotate(-15 120 250)"/>
    <ellipse cx="95" cy="200" rx="7" ry="10" transform="rotate(-20 95 200)"/>
    <ellipse cx="145" cy="170" rx="7" ry="10" transform="rotate(-30 145 170)"/>

    <ellipse cx="280" cy="250" rx="8" ry="11" transform="rotate(15 280 250)"/>
    <ellipse cx="305" cy="200" rx="7" ry="10" transform="rotate(20 305 200)"/>
    <ellipse cx="255" cy="170" rx="7" ry="10" transform="rotate(30 255 170)"/>

    <ellipse cx="175" cy="130" rx="6" ry="9" transform="rotate(-5 175 130)"/>
    <ellipse cx="225" cy="130" rx="6" ry="9" transform="rotate(5 225 130)"/>
    <ellipse cx="200" cy="110" rx="6" ry="9"/>
  </g>
</svg>
